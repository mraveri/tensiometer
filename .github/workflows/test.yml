name: test-CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:

  build:

    runs-on: ubuntu-latest

    strategy:

      fail-fast: true

      matrix:

        python-version: ["3.11", "3.12", "3.13"]
        # "oldest" installs the oldest supported torch, "latest" the newest wheel for the Python version:
        torch-version: ["oldest", "latest"]
        precision: ["float32"]

        exclude:
          # torch 2.3 has no Python 3.13 wheels:
          - python-version: "3.13"
            torch-version: "oldest"

        include:
          # full test suite in float64:
          - python-version: "3.12"
            torch-version: "latest"
            precision: "float64"

    env:
      TENSIOMETER_PRECISION: ${{ matrix.precision }}

    steps:

      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.torch-version }}" = "oldest" ]; then
            # oldest torch built against numpy 2 (numdifftools needs numpy >= 2):
            pip install "torch==2.3.1" --index-url https://download.pytorch.org/whl/cpu
          else
            pip install torch --index-url https://download.pytorch.org/whl/cpu
          fi
          pip install -r requirements.txt
          pip install coveralls

      - name: Software versions
        run: |
          python -c "import sys; \
                     print('Python version: ', sys.version); \
                     import torch; \
                     import numpy; \
                     print('PyTorch version =', torch.__version__); \
                     print('Numpy version   =', numpy.__version__); \
                     "

      - name: Run unit tests
        run: |
          make test_with_coverage

      - name: Upload coverage to coveralls
        if: matrix.precision == 'float32'
        run: coveralls --service=github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build documentation
        run: |
          make documentation

      - name: Test installation
        run: |
          make install
          make install_dev

  apple-silicon:

    # Apple Silicon runner: runs the suite on the MPS device when the runner exposes it.
    runs-on: macos-14

    steps:

      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          if python -c "import torch, sys; sys.exit(0 if torch.backends.mps.is_available() else 1)"; then
            export TENSIOMETER_DEVICE=mps
          fi
          echo "TENSIOMETER_DEVICE=${TENSIOMETER_DEVICE:-cpu}"
          make test
